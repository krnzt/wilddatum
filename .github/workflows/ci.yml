name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/web-bootstrap/package-lock.json
      - run: npm ci
        working-directory: viewer/web-bootstrap
      - run: npm run check
        working-directory: viewer/web-bootstrap
      - run: npm run build
        working-directory: viewer/web-bootstrap
      - run: npm audit --omit=dev
        working-directory: viewer/web-bootstrap
